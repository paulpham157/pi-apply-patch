name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tested commit and release history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The existing npm release predates semantic-release and has no Git tag.
      - name: Establish existing release baseline
        run: |
          set -euo pipefail
          baseline=74d55c8036927e5da578a86f3ca31338baa43680
          git merge-base --is-ancestor "$baseline" HEAD
          if git show-ref --verify --quiet refs/tags/v0.1.3; then
            test "$(git rev-parse 'v0.1.3^{commit}')" = "$baseline"
          else
            git tag v0.1.3 "$baseline"
          fi

      - name: Release to npm and GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
