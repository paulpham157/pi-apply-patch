name: Đề xuất tính năng
description: Đề xuất cải tiến chức năng hoặc trải nghiệm sử dụng
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
      description: Quy trình nào đang bị cản trở? Không gửi thông tin bí mật.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
      description: Mô tả hành vi mong muốn của apply-patch và một ví dụ sử dụng.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Phương án khác đã cân nhắc
      description: Có cách nào khác để giải quyết nhu cầu này không?
    validations:
      required: false
